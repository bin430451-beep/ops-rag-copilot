name: ops-rag-copilot
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    networks: [internal]
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:1.6
    profiles: ["gpu"]
    restart: unless-stopped
    command: ["--model-id", "${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}", "--port", "8080"]
    volumes:
      - model_cache:/data
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    networks: [internal]
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:1.6
    profiles: ["gpu"]
    restart: unless-stopped
    command: ["--model-id", "${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}", "--port", "8080"]
    volumes:
      - model_cache:/data
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    networks: [internal]
  llm:
    image: vllm/vllm-openai:v0.6.6
    profiles: ["gpu"]
    restart: unless-stopped
    command: >
      --model ${LLM_MODEL:-Qwen/Qwen2.5-14B-Instruct}
      --served-model-name ${LLM_MODEL:-Qwen/Qwen2.5-14B-Instruct}
      --host 0.0.0.0 --port 8000 --api-key EMPTY
    volumes:
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    networks: [internal]
  ollama:
    image: ollama/ollama:latest
    profiles: ["cpu"]
    restart: unless-stopped
    command: serve
    volumes:
      - model_cache:/root/.ollama
    networks: [internal]
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_data:/data
    depends_on: [qdrant]
    networks: [internal]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [backend]
    networks: [internal]
networks:
  internal:
    driver: bridge
volumes:
  qdrant_data:
  app_data:
  model_cache:
