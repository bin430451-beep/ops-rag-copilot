<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>OpsRAG Copilot</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
  .wrap{max-width:900px;margin:0 auto;padding:32px 20px}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:#94a3b8;font-size:13px;margin-bottom:24px}
  textarea{width:100%;min-height:90px;background:#1e293b;border:1px solid #334155;border-radius:8px;color:#e2e8f0;padding:12px;font-size:14px}
  button{margin-top:12px;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .out{margin-top:20px;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:16px;white-space:pre-wrap;font-size:14px;line-height:1.7;min-height:80px}
  .ref{margin-top:14px;font-size:12px;color:#94a3b8;white-space:pre-wrap}
  input{background:#1e293b;border:1px solid #334155;border-radius:8px;color:#e2e8f0;padding:10px;width:260px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>OpsRAG Copilot</h1>
  <div class="sub">私有云智能运维与知识协作 · 数据不出内网</div>
  <input id="apiKey" placeholder="X-API-Key" />
  <textarea id="q" placeholder="输入运维问题，例如：K8s Pod 一直 CrashLoopBackOff 怎么排查？"></textarea>
  <button id="btn">提问</button>
  <div class="out" id="out">结果会显示在这里…</div>
  <div class="ref" id="ref"></div>
</div>
<script>
const $ = id => document.getElementById(id);
$("btn").onclick = async () => {
  const q = $("q").value.trim();
  if (!q) return;
  $("btn").disabled = true;
  $("out").textContent = "检索中…";
  $("ref").textContent = "";
  try {
    const r = await fetch("/api/v1/chat/query", {
      method: "POST",
      headers: {"Content-Type":"application/json","X-API-Key":$("apiKey").value},
      body: JSON.stringify({question:q, top_k:5})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    $("out").textContent = d.answer;
    $("ref").textContent = (d.references||[]).map((x,i)=>
      `${i+1}. [${x.doc_name}] score=${(x.score||0).toFixed(3)}`).join("\n");
  } catch(e) {
    $("out").textContent = "请求失败：" + e.message;
  } finally { $("btn").disabled = false; }
};
</script>
</body>
</html>
